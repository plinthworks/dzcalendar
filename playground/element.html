<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DzCalendar — Web Component</title>
    <style>
      body { margin: 0; padding: 1.5rem; font: 14px/1.4 system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      p { margin: 0 0 1rem; color: #52525b; max-width: 80ch; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      dz-calendar { display: block; --dz-height: 34rem; }
      /* The page's own rule: it reaches the calendar in the page, not the one in its shadow root. */
      .dz-ev { outline: 2px solid rgb(220, 38, 38); }
      /* The isolated one is styled by its palette and its parts. */
      #isolated { --tz-accent: rgb(13, 148, 136); }
      #isolated::part(toolbar) { background: rgb(240, 253, 250); }
      #log { min-height: 1.4em; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>&lt;dz-calendar&gt;, sans framework</h1>
      <p>À gauche, dans la page : sa règle CSS (contour rouge) s'applique. À droite, isolé dans une shadow root : la page ne l'atteint pas, sa palette et ses parts (barre d'outils) le stylent.</p>
      <p id="log" role="status"></p>
      <div class="pair">
        <dz-calendar id="page" view="timeGridWeek" date="2026-10-21" time-zone="Europe/Paris" locale="fr-FR" editable selectable></dz-calendar>
        <dz-calendar id="isolated" shadow stylesheet="/packages/theme/dzcalendar.css" view="timeGridWeek" date="2026-10-21" time-zone="Asia/Tokyo" locale="fr-FR" editable></dz-calendar>
      </div>
    </main>
    <script type="module" src="./element.ts"></script>
  </body>
</html>
